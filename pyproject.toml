[project]
name = "nekomimi-mcp"
version = "0.1.0"
description = "Substrate-independent embodiment layer for conversational NPCs. Intent-to-renderer dispatch across multiple bodies (robotic, VRM, humanoid)."
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.4,<4",
    "httpx",
    "pydantic>=2",
    "prefab-ui>=0.14.0",
    "numpy",
]

[project.entry-points.'mcp.server']
nekomimi-mcp = "nekomimi_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nekomimi_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "T20"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"run_server.py" = ["T20"]
"scripts/**/*" = ["T20"]
"tests/**/*" = ["T20"]
"_stale_ref/**/*" = ["T20"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pre-commit>=4.6.2",
    "pytesseract>=0.3.13",
    "pywinauto>=0.6.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.16.0,<0.17"]
